trigger: none

parameters:
  - name: QA_APIM_NAME
    type: string
    displayName: QA APIM instance name
  - name: QA_APIM_RG
    type: string
    displayName: QA APIM resource group
  - name: ARTIFACTS_FOLDER
    type: string
    default: apim/dev                # Path (in repo) to the Dev-extracted artifacts
    displayName: Artifacts folder (source of truth)
  - name: CONFIGURATION_YAML_PATH
    type: string
    default: configuration.qa.yaml   # The environment override file for QA
    displayName: Publisher configuration file path
  - name: TARGET_BRANCH
    type: string
    default: main
    displayName: Branch to run on
  - name: USE_INCREMENTAL
    type: boolean
    default: false
    displayName: Publish only changes in last commit (COMMIT_ID)
  - name: COMMIT_ID
    type: string
    default: ""
    displayName: Specific commit SHA (optional when USE_INCREMENTAL=true)

variables:
  - group: apim-automation         

  - name: System.Debug
    value: true

stages:
  - stage: publish_to_qa
    displayName: Publish Dev artifacts to QA
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: run_publisher
        displayName: Run APIOps Publisher
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            persistCredentials: true
            clean: true

          # 1) Acquire Azure auth context + capture as variables for the Publisher
          - task: AzureCLI@2
            displayName: "Login & set Publisher variables"
            inputs:
              azureSubscription: "$(SERVICE_CONNECTION_NAME)"
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                Set-StrictMode -Version Latest
                $ErrorActionPreference = "Stop"

                # Bearer token & subscription for ARM
                $subId = az account show --query 'id' --output tsv
                $token = az account get-access-token --query 'accessToken' --output tsv

                Write-Host "##vso[task.setvariable issecret=true;variable=AZURE_SUBSCRIPTION_ID]$subId"
                Write-Host "##vso[task.setvariable issecret=true;variable=AZURE_BEARER_TOKEN]$token"
                Write-Host "##vso[task.setvariable issecret=true;variable=AZURE_RESOURCE_GROUP_NAME]${{ parameters.QA_APIM_RG }}"
                Write-Host "##vso[task.setvariable issecret=true;variable=API_MANAGEMENT_SERVICE_NAME]${{ parameters.QA_APIM_NAME }}"

              addSpnToEnvironment: true
              failOnStandardError: false

          # 2) Download Publisher tool (platform-appropriate)
          - task: PowerShell@2
            displayName: 'Fetch API Ops Publisher (Windows zip)'
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                Set-StrictMode -Version Latest
                $ErrorActionPreference = "Stop"
                $VerbosePreference = "Continue"
                $InformationPreference = "Continue"

                # Use a fixed version or parameterize via a variable if you prefer.
                $apiopsVersion = 'v6.0.2'  # or "$(apiops_release_version)"
                $downloadUrl   = "https://github.com/Azure/apiops/releases/download/v6.0.2/publisher-win-x64.zip"
                $tempDir    = Join-Path $env:AGENT_TEMPDIRECTORY "apiops"
                $zipPath    = Join-Path $tempDir "publisher.zip"
                $extractDir = Join-Path $tempDir "publisher"

                Write-Information "Preparing temp directories at '$tempDir'..."
                New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
                if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
                New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

                Write-Information "Downloading Publisher from: $downloadUrl"
                Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath

                Write-Information "Unzipping Publisher into '$extractDir'..."
                Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

                # Find the Publisher EXE in the unzipped content
                $exe = Get-ChildItem -Path $extractDir -Recurse -File -Filter "publisher*.exe" | Select-Object -First 1
                if (-not $exe) {
                  throw "Publisher executable not found in '$extractDir'."
                }

                Write-Host "Publisher resolved to: $($exe.FullName)"
                Write-Host "##vso[task.setvariable variable=PUBLISHER_EXE]$($exe.FullName)"

          # 3) (Optional) Replace tokens in configuration.qa.yaml (only if you use tokens like #{...}#)
          #    If you don't use tokens, you can remove this step.
          #    Note: This requires the "Replace Tokens" marketplace extension; otherwise skip.
          # - task: qetza.replacetokens.replacetokens-task.replacetokens@5
          #   displayName: "Replace tokens in configuration.qa.yaml"
          #   inputs:
          #     targetFiles: "${{ parameters.CONFIGURATION_YAML_PATH }}"
          #     encoding: "auto"
          #     tokenPattern: "octopus"   # #{VarName}#
          #     writeBOM: true
          #     actionOnMissing: "warn"

          # 4) Run Publisher
          - task: PowerShell@2
            displayName: "Run Publisher (Dev → QA)"
            inputs:
              targetType: inline
              script: |
                Set-StrictMode -Version Latest
                $ErrorActionPreference = "Stop"

                $artifacts = Join-Path "$(Build.SourcesDirectory)" "${{ parameters.ARTIFACTS_FOLDER }}"
                if (-not (Test-Path $artifacts)) { throw "Artifacts folder not found: $artifacts" }

                Write-Host "Artifacts: $artifacts"
                Write-Host "Config: ${{ parameters.CONFIGURATION_YAML_PATH }}"
                Write-Host "Target APIM: $(API_MANAGEMENT_SERVICE_NAME) in RG $(AZURE_RESOURCE_GROUP_NAME)"
                
                $env:API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH = $artifacts
                $env:CONFIGURATION_YAML_PATH = "$(Build.SourcesDirectory)/${{ parameters.CONFIGURATION_YAML_PATH }}"
                $env:AZURE_SUBSCRIPTION_ID = "$(AZURE_SUBSCRIPTION_ID)"
                $env:AZURE_RESOURCE_GROUP_NAME = "$(AZURE_RESOURCE_GROUP_NAME)"
                $env:API_MANAGEMENT_SERVICE_NAME = "$(API_MANAGEMENT_SERVICE_NAME)"
                $env:AZURE_BEARER_TOKEN = "$(AZURE_BEARER_TOKEN)"
                $env:Logging__LogLevel__Default = "Information"

                if ("${{ parameters.USE_INCREMENTAL }}" -eq "true" -and -not [string]::IsNullOrWhiteSpace("${{ parameters.COMMIT_ID }}")) {
                  $env:COMMIT_ID = "${{ parameters.COMMIT_ID }}"
                  Write-Host "Incremental publish for commit $env:COMMIT_ID"
                }

                & "$(PUBLISHER_EXE)"
                
                $exit = $LASTEXITCODE  # safe now; a native process just ran
                  if ($exit -ne 0) { throw "Publisher failed with exit code $exit" }
                  Write-Host "Publisher completed."

                # if ($LASTEXITCODE -ne 0) { throw "Publisher failed with exit code $LASTEXITCODE" }

                # Write-Host "Publisher completed."
              pwsh: true
              failOnStderr: true